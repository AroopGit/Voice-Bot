<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vahak Support Assistant | Voice Bot</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-blue: #2563eb;
            --accent-red: #ef4444;
            --bubble-bot: #f1f5f9;
            --bubble-user: #2563eb;
            --bubble-user-text: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Mobile Container Mockup */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 90vh;
            background-color: var(--bg-card);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        @media (max-width: 480px) {
            .app-container {
                height: 100vh;
                border-radius: 0;
            }
        }

        /* Header */
        .app-header {
            padding: 24px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .logo-left {
            height: 32px;
            width: auto;
        }

        .header-center {
            text-align: left;
            flex: 1;
            padding-left: 12px;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .status-dot.active {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .logo-right {
            height: 32px;
            width: auto;
        }

        /* Visualizer Area */
        .visualizer-section {
            flex: 0 0 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 20px;
        }

        .orb-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orb {
            width: 80px;
            height: 80px;
            background: #3b82f6;
            border-radius: 35% 65% 65% 35% / 45% 45% 55% 55%;
            filter: blur(1px);
            transition: all 0.5s ease;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
            animation: morph 8s ease-in-out infinite;
        }

        @keyframes morph {
            0% {
                border-radius: 35% 65% 65% 35% / 45% 45% 55% 55%;
                transform: scale(1);
            }

            33% {
                border-radius: 53% 47% 33% 67% / 54% 39% 61% 46%;
                transform: scale(1.05);
            }

            66% {
                border-radius: 42% 58% 52% 48% / 49% 62% 38% 51%;
                transform: scale(0.95);
            }

            100% {
                border-radius: 35% 65% 65% 35% / 45% 45% 55% 55%;
                transform: scale(1);
            }
        }

        .orb.listening {
            background: #2563eb;
            animation: morph 4s ease-in-out infinite, pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(37, 99, 235, 0.6);
        }

        .orb.speaking {
            background: #60a5fa;
            animation: morph 2s ease-in-out infinite, ripple 1.2s infinite ease-out;
            box-shadow: 0 0 80px rgba(96, 165, 250, 0.7);
        }

        .orb.processing {
            background: #94a3b8;
            animation: breathe 1s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes ripple {
            0% {
                box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.4);
            }

            100% {
                box-shadow: 0 0 0 40px rgba(96, 165, 250, 0);
            }
        }

        @keyframes breathe {
            from {
                transform: scale(0.9);
                opacity: 0.6;
            }

            to {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        .processing-text {
            margin-top: 24px;
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .processing-text.visible {
            opacity: 1;
        }

        /* Chat History */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-history::-webkit-scrollbar {
            width: 4px;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 4px;
        }

        .message-row {
            display: flex;
            width: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-row.bot-row {
            justify-content: flex-start;
        }

        .message-row.user-row {
            justify-content: flex-end;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .bot-message {
            background-color: var(--bubble-bot);
            color: var(--text-primary);
            border-top-left-radius: 4px;
        }

        .user-message {
            background-color: var(--bubble-user);
            color: var(--bubble-user-text);
            border-top-right-radius: 4px;
        }

        .msg-timestamp {
            display: block;
            font-size: 0.7rem;
            margin-top: 4px;
            opacity: 0.6;
        }

        /* Controls */
        .app-controls {
            padding: 24px 20px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #start-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--accent-red);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
            transition: all 0.3s;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 24px rgba(239, 68, 68, 0.4);
        }

        #start-btn i {
            font-size: 28px;
        }

        #start-btn.idle {
            background-color: var(--accent-blue);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .latency-text {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Sidebar (hidden but necessary for state) */
        #active-lang,
        #conn-status {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <img src="AIEnhancer_oneture_logo-removebg-preview.png" alt="Oneture Logo" class="logo-left">
            <div class="header-center">
                <h1 class="header-title">Vahak Support Assistant</h1>
                <div class="status-container">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="session-time">00:00</span>
                </div>
            </div>
            <img src="aws_logo.png" alt="AWS Logo" class="logo-right">
        </header>

        <section class="visualizer-section">
            <div class="orb-wrapper">
                <div class="orb" id="orb"></div>
            </div>
            <div class="processing-text" id="status-text">Processing...</div>
        </section>

        <main class="chat-history" id="chat-box">
            <!-- Messages will appear here -->
        </main>

        <footer class="app-controls">
            <button id="start-btn" class="idle">
                <i class="fas fa-microphone"></i>
                <span style="display: none;">Start Conversation</span>
            </button>
            <div class="latency-text">
                Latency: <span id="latency-val">0ms</span>
            </div>
        </footer>
        <!-- Hidden elements for script compatibility -->
        <span id="active-lang">English</span>
        <span id="conn-status">Disconnected</span>
    </div>

    <script src="voice-app.js"></script>
    <script>
        // UI Interaction enhancements
        const btn = document.getElementById('start-btn');
        const btnIcon = btn.querySelector('i');
        const statusDot = document.getElementById('status-dot');
        const sessionTimeElem = document.getElementById('session-time');

        let sessionStartTime = null;
        let timerInterval = null;

        function updateTimer() {
            if (!sessionStartTime) return;
            const now = new Date();
            const diff = Math.floor((now - sessionStartTime) / 1000);
            const mins = Math.floor(diff / 60).toString().padStart(2, '0');
            const secs = (diff % 60).toString().padStart(2, '0');
            sessionTimeElem.innerText = `${mins}:${secs}`;
        }

        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    if (btn.classList.contains('active')) {
                        btnIcon.className = 'fas fa-stop';
                        statusDot.classList.add('active');

                        if (!sessionStartTime) {
                            sessionStartTime = new Date();
                            timerInterval = setInterval(updateTimer, 1000);
                        }
                    } else if (btn.classList.contains('idle')) {
                        btnIcon.className = 'fas fa-microphone';
                        statusDot.classList.remove('active');

                        clearInterval(timerInterval);
                        sessionStartTime = null;
                        sessionTimeElem.innerText = "00:00";
                    }
                }
            });
        });

        observer.observe(btn, { attributes: true });
    </script>
</body>

</html>
